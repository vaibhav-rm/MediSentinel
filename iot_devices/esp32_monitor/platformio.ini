; Shared settings for every build environment.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    oxullo/MAX30100lib@^1.2.1

; ── Version-variation builds ────────────────────────────────────────────────
; Each environment compiles the SAME source with a different FW_VERSION, producing
; a distinct .bin (shown on the LCD header). Build all with:  pio run
; The image for env X lands at .pio/build/X/firmware.bin and is uploaded to the
; backend OTA store. Bootstrap one over USB (e.g. `pio run -e v1_0_0 -t upload`),
; then push the others over the air from the dashboard.
[env:v1_0_0]
build_flags = -DFW_VERSION=\"v1.0.0\"
